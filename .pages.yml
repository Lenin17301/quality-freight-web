media:
  input: public/images
  output: /images

content:
  - name: team
    label: Equipo de Trabajo
    path: src/data/team.json
    type: file
    fields:
      - name: members
        label: Integrantes del Equipo
        type: object
        list: true
        fields:
          - name: id
            label: Identificador interno (sin espacios)
            type: string
            required: true
          - name: name
            label: Nombre y Apellido
            type: string
            required: true
          - name: role_es
            label: Cargo (Español)
            type: string
          - name: role_en
            label: Cargo (Inglés)
            type: string
          - name: photo
            label: Fotografía del integrante
            type: image
          - name: active
            label: Visible en la página web
            type: boolean
            default: true